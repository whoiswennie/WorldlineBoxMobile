name: worldlinebox_mobile
description: Mobile companion client for the WorldlineBox desktop application.
publish_to: none
version: 0.1.6+12
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  dartssh2: 4.1.0
  file_picker: ^10.3.10
  flutter_markdown_plus: ^1.0.7
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  wechat_assets_picker: ^10.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file: ^7.0.1
  path_provider_platform_interface: ^2.1.3
flutter:
  uses-material-design: true
  assets:
    - assets/portraits/
    - assets/call-backgrounds/
    - assets/worldlinebox-logo.png
    - assets/pet-viewer/
    - licenses/
